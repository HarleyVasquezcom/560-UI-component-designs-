<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabs - Nordic Frost Gradient / Gradiente Nórdo Frío</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #e0f2fe; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    header.demo-header { position: fixed; top: 0; left: 0; right: 0; padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; color: #fff; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .demo-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; margin-top: 2rem; }
    footer.demo-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
    footer.demo-footer a { color: inherit; text-decoration: underline; }

        body { color: #1e293b; }
        header.demo-header { background: rgba(224, 242, 254, 0.9); color: #0369a1; border-bottom: 1px solid #bae6fd; }
        footer.demo-footer { background: rgba(224, 242, 254, 0.9); color: #0284c7; }
        .component-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border: 1px solid #bae6fd; border-radius: 20px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15); width: 100%; text-align: center; }
        .ui-element { background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; border: none; padding: 0.75rem 1.5rem; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: all 0.3s ease; outline: none; display: inline-block; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .ui-element:hover, .ui-element:focus { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4); }


  </style>
</head>
<body>
  <header class="demo-header">
    <div><strong>TABS</strong> - Design 09: Nordic Frost Gradient / Gradiente Nórdo Frío</div>
    <div>By Harley Vásquez</div>
  </header>

  <main class="demo-container">
    <div class="component-box">
      <div style="width: 100%; max-width: 400px; margin: 0 auto;"><div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;"><button class="tab-btn ui-element active" data-tab="1" aria-label="Tab 1">Tab 1</button><button class="tab-btn ui-element" data-tab="2" aria-label="Tab 2">Tab 2</button></div><div id="tab-panel-1" class="tab-panel" style="display: block; padding: 1rem; border: 1px solid currentColor; border-radius: 8px;">Content for Panel 1</div><div id="tab-panel-2" class="tab-panel" style="display: none; padding: 1rem; border: 1px solid currentColor; border-radius: 8px;">Content for Panel 2</div></div>
    </div>
  </main>

  <footer class="demo-footer">
    Design #09 | <a href="index.html">Back to tabs Gallery</a> | Designed by Harley Vásquez | <a href="https://www.linkedin.com/in/harleyvasquez/" target="_blank">LinkedIn</a>
  </footer>

  <script>
    const btns = document.querySelectorAll('.tab-btn'); btns.forEach(btn => { btn.addEventListener('click', () => { btns.forEach(b => b.classList.remove('active')); btn.classList.add('active'); const target = btn.getAttribute('data-tab'); document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none'); document.getElementById('tab-panel-' + target).style.display = 'block'; }); });
  </script>
</body>
</html>
