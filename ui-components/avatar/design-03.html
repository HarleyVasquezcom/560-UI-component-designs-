<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>avatar - Soft Neumorphism Light / Neumorfismo Suave Claro</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #e0e5ec; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    header.demo-header { position: fixed; top: 0; left: 0; right: 0; padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; color: #fff; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .demo-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; margin-top: 2rem; }
    footer.demo-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
    footer.demo-footer a { color: inherit; text-decoration: underline; }

        body { color: #4a5568; }
        header.demo-header { background: #e0e5ec; color: #2d3748; border-bottom: 2px solid #d1d9e6; }
        footer.demo-footer { background: #e0e5ec; color: #718096; }
        .component-box { background: #e0e5ec; border-radius: 20px; padding: 2.5rem; box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5); width: 100%; text-align: center; }
        .ui-element { background: #e0e5ec; color: #3182ce; border: none; padding: 0.85rem 1.75rem; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; box-shadow: 6px 6px 12px #b8b9be, -6px -6px 12px #ffffff; transition: all 0.2s ease; outline: none; display: inline-block; }
        .ui-element:active, .ui-element.active, .ui-element:focus { box-shadow: inset 4px 4px 8px #b8b9be, inset -4px -4px 8px #ffffff; }


  </style>
</head>
<body>
  <header class="demo-header">
    <div><strong>AVATAR</strong> - Design 03: Soft Neumorphism Light / Neumorfismo Suave Claro</div>
    <div>By Harley Vásquez</div>
  </header>

  <main class="demo-container">
    <div class="component-box">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;"><div id="avatar-img" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; position: relative;">HV<span id="status-dot" style="position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; background: #22c55e; border-radius: 50%; border: 2px solid #000;"></span></div><div id="avatar-info" style="font-size: 0.9rem; font-weight: bold;">Status: Online</div></div>
    </div>
  </main>

  <footer class="demo-footer">
    Design #03 | <a href="index.html">Back to avatar Gallery</a> | Designed by Harley Vásquez | <a href="https://www.linkedin.com/in/harleyvasquez/" target="_blank">LinkedIn</a>
  </footer>

  <script>
    const av = document.getElementById('avatar-img'); const dot = document.getElementById('status-dot'); const info = document.getElementById('avatar-info'); let online = true; av.addEventListener('click', () => { online = !online; dot.style.background = online ? '#22c55e' : '#ef4444'; info.textContent = 'Status: ' + (online ? 'Online' : 'Offline'); });
  </script>
</body>
</html>
