<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>code-block - Retro Terminal Green / Terminal Retro Verde</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0a0f0d; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    header.demo-header { position: fixed; top: 0; left: 0; right: 0; padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; color: #fff; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .demo-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; margin-top: 2rem; }
    footer.demo-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
    footer.demo-footer a { color: inherit; text-decoration: underline; }

        body { color: #33ff33; font-family: monospace; }
        header.demo-header { background: #000; color: #33ff33; border-bottom: 1px dashed #33ff33; }
        footer.demo-footer { background: #000; color: #33ff33; }
        .component-box { background: #050b07; border: 1px solid #33ff33; padding: 2rem; box-shadow: 0 0 10px rgba(51, 255, 51, 0.2); width: 100%; text-align: center; }
        .ui-element { background: transparent; color: #33ff33; border: 1px solid #33ff33; padding: 0.75rem 1.5rem; cursor: pointer; font-size: 1rem; font-family: monospace; transition: all 0.2s ease; outline: none; display: inline-block; }
        .ui-element:hover, .ui-element:focus { background: #33ff33; color: #000; }


  </style>
</head>
<body>
  <header class="demo-header">
    <div><strong>CODE-BLOCK</strong> - Design 05: Retro Terminal Green / Terminal Retro Verde</div>
    <div>By Harley Vásquez</div>
  </header>

  <main class="demo-container">
    <div class="component-box">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 380px;"><div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-family: monospace; font-size: 0.85rem;">JavaScript</span><button id="copy-btn" class="ui-element" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" aria-label="Copy Code">Copy</button></div><pre style="padding: 1rem; border: 1px solid currentColor; border-radius: 6px; text-align: left; overflow-x: auto; font-family: monospace; font-size: 0.85rem;"><code id="code-content">console.log("Hello, World!");</code></pre></div>
    </div>
  </main>

  <footer class="demo-footer">
    Design #05 | <a href="index.html">Back to code-block Gallery</a> | Designed by Harley Vásquez | <a href="https://www.linkedin.com/in/harleyvasquez/" target="_blank">LinkedIn</a>
  </footer>

  <script>
    const btn = document.getElementById('copy-btn'); const code = document.getElementById('code-content'); btn.addEventListener('click', () => { navigator.clipboard ? navigator.clipboard.writeText(code.textContent) : null; btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy'; }, 2000); });
  </script>
</body>
</html>
