<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>infinite-scroll - Retro Terminal Green / Terminal Retro Verde</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0a0f0d; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    header.demo-header { position: fixed; top: 0; left: 0; right: 0; padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; color: #fff; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .demo-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; margin-top: 2rem; }
    footer.demo-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
    footer.demo-footer a { color: inherit; text-decoration: underline; }

        body { color: #33ff33; font-family: monospace; }
        header.demo-header { background: #000; color: #33ff33; border-bottom: 1px dashed #33ff33; }
        footer.demo-footer { background: #000; color: #33ff33; }
        .component-box { background: #050b07; border: 1px solid #33ff33; padding: 2rem; box-shadow: 0 0 10px rgba(51, 255, 51, 0.2); width: 100%; text-align: center; }
        .ui-element { background: transparent; color: #33ff33; border: 1px solid #33ff33; padding: 0.75rem 1.5rem; cursor: pointer; font-size: 1rem; font-family: monospace; transition: all 0.2s ease; outline: none; display: inline-block; }
        .ui-element:hover, .ui-element:focus { background: #33ff33; color: #000; }


  </style>
</head>
<body>
  <header class="demo-header">
    <div><strong>INFINITE-SCROLL</strong> - Design 05: Retro Terminal Green / Terminal Retro Verde</div>
    <div>By Harley Vásquez</div>
  </header>

  <main class="demo-container">
    <div class="component-box">

          <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; max-width: 320px;">
            <div id="scroll-list" style="height: 150px; overflow-y: auto; border: 1px solid currentColor; width: 100%; padding: 0.5rem;">
              <div class="scroll-item" style="padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">Item 1</div>
              <div class="scroll-item" style="padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">Item 2</div>
              <div class="scroll-item" style="padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">Item 3</div>
            </div>
            <button id="load-more-btn" class="ui-element" aria-label="Load More Items">Load More</button>
          </div>

    </div>
  </main>

  <footer class="demo-footer">
    Design #05 | <a href="index.html">Back to infinite-scroll Gallery</a> | Designed by Harley Vásquez | <a href="https://www.linkedin.com/in/harleyvasquez/" target="_blank">LinkedIn</a>
  </footer>

  <script>

          const list = document.getElementById('scroll-list');
          const btn = document.getElementById('load-more-btn');
          let count = 3;
          btn.addEventListener('click', () => {
            for (let i = 0; i < 2; i++) {
              count++;
              const div = document.createElement('div');
              div.className = 'scroll-item';
              div.style.cssText = 'padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);';
              div.textContent = 'Item ' + count;
              list.appendChild(div);
            }
          });

  </script>
</body>
</html>
