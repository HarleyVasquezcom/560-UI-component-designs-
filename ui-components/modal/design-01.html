<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>modal - Modern Dark Glassmorphism / Glassmorfismo Oscuro Moderno</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    header.demo-header { position: fixed; top: 0; left: 0; right: 0; padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; color: #fff; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .demo-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; margin-top: 2rem; }
    footer.demo-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
    footer.demo-footer a { color: inherit; text-decoration: underline; }

        body { color: #f8fafc; }
        .component-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 2rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); width: 100%; text-align: center; }
        .ui-element { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: all 0.3s ease; outline: none; display: inline-block; }
        .ui-element:hover, .ui-element:focus { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.4); box-shadow: 0 0 15px rgba(255,255,255,0.2); }


  </style>
</head>
<body>
  <header class="demo-header">
    <div><strong>MODAL</strong> - Design 01: Modern Dark Glassmorphism / Glassmorfismo Oscuro Moderno</div>
    <div>By Harley Vásquez</div>
  </header>

  <main class="demo-container">
    <div class="component-box">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;"><button id="modal-open" class="ui-element" aria-label="Open Dialog Modal">Open Modal</button><div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 2000;"><div style="background: inherit; border: 1px solid currentColor; padding: 2rem; border-radius: 12px; max-width: 320px; text-align: center;"><h3>Modal Window</h3><p style="margin: 1rem 0; font-size: 0.9rem;">This is a modal popover window.</p><button id="modal-close" class="ui-element" aria-label="Close Dialog Modal">Close</button></div></div></div>
    </div>
  </main>

  <footer class="demo-footer">
    Design #01 | <a href="index.html">Back to modal Gallery</a> | Designed by Harley Vásquez | <a href="https://www.linkedin.com/in/harleyvasquez/" target="_blank">LinkedIn</a>
  </footer>

  <script>
    const open = document.getElementById('modal-open'); const close = document.getElementById('modal-close'); const overlay = document.getElementById('modal-overlay'); open.addEventListener('click', () => { overlay.style.display = 'flex'; }); close.addEventListener('click', () => { overlay.style.display = 'none'; });
  </script>
</body>
</html>
