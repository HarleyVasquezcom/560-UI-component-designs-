<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sidebar - Editorial High-Contrast Serif / Editorial Alto Contraste Serif</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f1ea; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    header.demo-header { position: fixed; top: 0; left: 0; right: 0; padding: 0.75rem 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; color: #fff; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .demo-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; margin-top: 2rem; }
    footer.demo-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
    footer.demo-footer a { color: inherit; text-decoration: underline; }

        body { color: #1a1a1a; font-family: 'Times New Roman', Times, serif; }
        header.demo-header { background: #f4f1ea; color: #1a1a1a; border-bottom: 2px solid #1a1a1a; }
        footer.demo-footer { background: #f4f1ea; color: #555; }
        .component-box { background: #fff8f0; border: 2px solid #1a1a1a; padding: 2.5rem; width: 100%; text-align: center; box-shadow: 8px 8px 0px #1a1a1a; }
        .ui-element { background: #1a1a1a; color: #fff8f0; border: 2px solid #1a1a1a; padding: 0.75rem 1.5rem; cursor: pointer; font-size: 1.1rem; font-style: italic; transition: all 0.2s ease; outline: none; display: inline-block; }
        .ui-element:hover, .ui-element:focus { background: #fff8f0; color: #1a1a1a; }


  </style>
</head>
<body>
  <header class="demo-header">
    <div><strong>SIDEBAR</strong> - Design 07: Editorial High-Contrast Serif / Editorial Alto Contraste Serif</div>
    <div>By Harley Vásquez</div>
  </header>

  <main class="demo-container">
    <div class="component-box">

          <div style="display: flex; gap: 1rem; align-items: stretch; justify-content: center; width: 100%; max-width: 450px;">
            <aside id="sidebar" style="width: 140px; padding: 1rem; border: 1px solid currentColor; border-radius: 8px; transition: all 0.3s;">
              <button id="sb-toggle" class="ui-element" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; margin-bottom: 0.5rem;" aria-label="Toggle Sidebar">Collapse</button>
              <div class="sb-nav" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <a href="#" style="color: inherit;">Overview</a>
                <a href="#" style="color: inherit;">Reports</a>
              </div>
            </aside>
            <main style="flex: 1; padding: 1rem; border: 1px solid currentColor; border-radius: 8px; text-align: left;">
              <h4>Dashboard Content</h4>
              <p style="font-size: 0.85rem; margin-top: 0.5rem;">Sidebar toggle test.</p>
            </main>
          </div>

    </div>
  </main>

  <footer class="demo-footer">
    Design #07 | <a href="index.html">Back to sidebar Gallery</a> | Designed by Harley Vásquez | <a href="https://www.linkedin.com/in/harleyvasquez/" target="_blank">LinkedIn</a>
  </footer>

  <script>

          const sb = document.getElementById('sidebar');
          const btn = document.getElementById('sb-toggle');
          const nav = sb.querySelector('.sb-nav');
          btn.addEventListener('click', () => {
            const isCollapsed = nav.style.display === 'none';
            nav.style.display = isCollapsed ? 'flex' : 'none';
            sb.style.width = isCollapsed ? '140px' : '60px';
            btn.textContent = isCollapsed ? 'Collapse' : 'Expand';
          });

  </script>
</body>
</html>
